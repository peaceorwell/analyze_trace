<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Torch Profiler Analyzer logo">
  <title>Torch Profiler Analyzer</title>
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f2f6ff"/>
      <stop offset="1" stop-color="#e6efff"/>
    </linearGradient>

    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(39 20) rotate(64) scale(34 26)">
      <stop offset="0" stop-color="#ffb84d" stop-opacity="0.5"/>
      <stop offset="0.48" stop-color="#ff8a1f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="barBlue" x1="14" y1="46" x2="22" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#8ea1ff"/>
    </linearGradient>

    <linearGradient id="barOrange" x1="26" y1="47" x2="34" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="barPurple" x1="38" y1="47" x2="46" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="sweep" x1="15" y1="39" x2="50" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.48" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#35456f" flood-opacity="0.2"/>
    </filter>

    <filter id="hotGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4.5" y="4.5" width="55" height="55" rx="16" fill="url(#bg)" stroke="#c7d5ee" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="16" fill="url(#warmGlow)"/>

  <!-- Trace baseline and latency pulse -->
  <path d="M12 48H52" fill="none" stroke="#d5dfef" stroke-width="2" stroke-linecap="round"/>
  <path d="M13 47.5c4.8 0 4.8-5.5 9.6-5.5 4.8 0 4.8 5.5 9.6 5.5 5.8 0 5.8-12.5 11.6-12.5 3.2 0 4.8 3.8 7.2 8.2" fill="none" stroke="#96a7c5" stroke-width="2.2" stroke-linecap="round" opacity="0.74"/>

  <!-- Hotspot bars -->
  <rect x="14" y="33" width="8.5" height="15" rx="4.2" fill="url(#barBlue)"/>
  <rect x="26" y="24" width="8.5" height="24" rx="4.2" fill="url(#barOrange)"/>
  <rect x="38" y="17" width="8.5" height="31" rx="4.2" fill="url(#barPurple)"/>

  <!-- Optimization trend line -->
  <path d="M15.5 39.5c7.8-1.2 11.4-10.2 17.6-15.4 4.4-3.7 8.6-5 15.4-6.2" fill="none" stroke="#ffffff" stroke-width="6.8" stroke-linecap="round" opacity="0.75"/>
  <path d="M15.5 39.5c7.8-1.2 11.4-10.2 17.6-15.4 4.4-3.7 8.6-5 15.4-6.2" fill="none" stroke="url(#sweep)" stroke-width="4.1" stroke-linecap="round"/>
  <path d="M45.4 13.8 53.2 16 47.6 21.9Z" fill="#f97316" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Analyzer lens: inspecting the hottest region -->
  <circle cx="42.5" cy="24" r="8.4" fill="#ffffff" fill-opacity="0.36" stroke="#6366f1" stroke-width="3"/>
  <path d="M48.8 30.2 55.4 36.8" fill="none" stroke="#f97316" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="42.5" cy="24" r="2.7" fill="#fbbf24" filter="url(#hotGlow)"/>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: Run CLI tests
        run: |
          python -c "from trace_analyzer import parse_trace, compute_avgs; print('Package import OK')"

      - name: Run unit tests
        run: |
          pytest tests/ -v

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run syntax check
        run: |
          python -m py_compile analyze_trace.py
          python -m py_compile trace_analyzer/core.py
          python -m py_compile web/server.py
          python -m py_compile web/db.py

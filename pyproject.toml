[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-analyzer"
version = "0.3.27"
description = "Analyze PyTorch profiler Chrome Trace JSON files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
classifiers = [
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "ijson>=3.2.3",
    "orjson>=3.11.9",
    "pysimdjson>=6.0.0",
]

[project.scripts]
analyze-trace = "trace_analyzer.core:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "ldap3>=2.9.1",
    "itsdangerous>=2.2.0",
]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["trace_analyzer*"]
